spring:
  application:
    name: forexIntel
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true

jwt:
  secret: ${JWT_SECRET:votre_cle_secrete_jwt_hmac_256_bits_minimale_pour_le_dev_qui_doit_etre_longue}
  expiration: ${JWT_EXPIRATION_MS:900000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION_MS:604800000}

vault:
  encryption-key: ${ENCRYPTION_KEY:ForexIntelMasterKey2026Secure32B}

mt5:
  bridge:
    url: ${MT5_BRIDGE_URL:http://localhost:5001}

cors:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000,http://127.0.0.1:4200}
